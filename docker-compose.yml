services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: michelle
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend-michelle
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/michelle
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build: ./web-michelle
    restart: unless-stopped
    environment:
      PORT: 3001
    depends_on:
      - backend
    ports:
      - "3001:3001"

volumes:
  mongo_data:
