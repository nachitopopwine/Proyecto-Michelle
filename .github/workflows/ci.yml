name: Verificar proyecto Michelle
on:
  push:
    branches: [main, desarrollo-michelle, arquitectura-monolito]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-michelle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-michelle/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test -- --runInBand --silent

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-michelle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-michelle/package-lock.json
      - run: npm ci
      - name: Compilar versión estática (igual que Cloudflare Pages)
        env:
          DEPLOY_STATIC: 'true'
          NEXT_PUBLIC_API_URL: https://example.invalid
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
