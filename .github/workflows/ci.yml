name: CI

on:
  push:
    branches: [main, desarrollo-michelle]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-michelle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-michelle/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand --coverage

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-michelle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-michelle/package-lock.json
      - run: npm ci
      - run: npm run build
