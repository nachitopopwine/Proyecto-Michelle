# Servicio gratuito de API (solo demostración/desarrollo; no uso clínico productivo).
services:
  - type: web
    name: michelle-api
    runtime: node
    plan: free
    rootDir: backend-michelle
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: PORT
        value: 10000
      - key: TIME_ZONE
        value: America/Santiago
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Michelle Palta
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CRON_SECRET
        sync: false
